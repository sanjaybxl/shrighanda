<section class="sponsor-section">
  <header class="sponsor-heading">
    <span class="sponsor-heading__eyebrow">With gratitude</span>
    <h2 class="sponsor-title">Our Sponsors</h2>
    <p class="sponsor-heading__description">Thank you for supporting our community and celebrations.</p>
    <span class="sponsor-heading__accent" aria-hidden="true"></span>
  </header>

  <div class="logo-slider" [class.static-display]="logos.length <= 3" role="region" aria-label="Our sponsors">
    <div class="logo-track" *ngIf="logos.length > 3; else staticDisplay">
      <div class="logo-card" *ngFor="let logo of duplicatedLogos">
        <img [src]="logo" alt="Sponsor logo" loading="lazy" />
      </div>
    </div>

    <ng-template #staticDisplay>
      <div class="logo-static">
        <div class="logo-card" *ngFor="let logo of logos">
          <img [src]="logo" alt="Sponsor logo" loading="lazy" />
        </div>
      </div>
    </ng-template>
  </div>
</section>
