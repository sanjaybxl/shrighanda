<section class="bg-smoke events-section" id="event">
    <div class="vs-container style2">
      <div class="title-area text-center">
        <span class="events-title__eyebrow">ಶ್ರೀಗಂಧ • ಕನ್ನಡ ಸಂಭ್ರಮ</span>
        <h2 class="events-title__heading">Upcoming Events</h2>
        <p class="events-title__subtitle">Culture, performances, and community—celebrated together.</p>
        <span class="events-title__accent" aria-hidden="true"></span>
      </div>
  
      <app-event-poster
        [event]="eventDetails"
        [showRegistrationLink]="true">
      </app-event-poster>
    </div>
  </section>
