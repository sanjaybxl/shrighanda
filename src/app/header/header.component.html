<section>
  <!-- Top Section moved outside of the header -->
  <div class="top-section">
    <div class="contact-info">
      <span>
        <i class="fas fa-phone-alt" style="color: black;"></i><a href="tel:+31685238923"> +31 68249 2845</a>
        <i class="fas fa-envelope pr-1" style="color: black;"></i> <a
          href="mailto:info@shrigandha.nl">info&#64;shrigandha.nl</a>
      </span>
    </div>
    <div class="social-media">
      <span
        style="font-weight: bold; color: black; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Follow
        Us:</span>
      <a href="https://www.facebook.com/ShrigandhaKannadaBaLaga/" target="_blank"><i class="fab fa-facebook"
          style="color: black;"></i></a>
      <a href="https://www.instagram.com/shrigandha_holland_kanbalaga/" target="_blank"><i class="fab fa-instagram"
          style="color: black;"></i></a>
      <a href="https://chat.whatsapp.com/L9OiMbxdhMD9QcuFopPzOC" target="_blank"><i class="fab fa-whatsapp"
          style="color: black;"></i></a>
      <a href="https://www.youtube.com/@ShrigandhaNL" target="_blank"><i class="fab fa-youtube"
          style="color: black;"></i></a>

      <a [routerLink]="['/cart']" [queryParams]="{ type : 'business' }" title="Cart Business" class="cart-icon position-relative">
        <i class="fas fa-store" style="font-size: 14px; color: black"></i>
        <span class="badge badge-light" *ngIf="cartService.getCartItemCountByType('business') > 0">{{ cartService.getCartItemCountByType('business')
          }}</span>
      </a>

      <a [routerLink]="['/cart']" [queryParams]="{ type : 'nonbusiness' }" title="Cart" class="cart-icon position-relative">
        <i class="fas fa-shopping-cart" style="font-size: 14px; color: black"></i>
        <span class="badge badge-light" *ngIf="cartService.getCartItemCountByType('nonbusiness') > 0">{{ cartService.getCartItemCountByType('nonbusiness')
          }}</span>
      </a>
    </div>

  </div>

  <section>
    <input type="checkbox" id="check" [(ngModel)]="isMenuOpen" [ngModelOptions]="{ standalone: true }">
    <header>
      <a routerLink="/home" class="brand" aria-label="Shrigandha Holland Kannada Association home" (click)="isMenuOpen = false">
        <img
          src="https://usercontent.one/wp/shrigandha.nl/wp-content/themes/shrighanda_new/angular-app/assets/Shrigandha-logo.png"
          class="brand__logo"
          alt="">
        <span class="brand__title">ಶ್ರೀಗಂಧ ಹಾಲೆಂಡ್ ಕನ್ನಡ ಬಳಗ</span>
      </a>
      <nav id="primary-navigation" class="menu" aria-label="Main navigation">
        <a routerLink="/home" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="isMenuOpen = false">Home</a>
        <a routerLink="/about" routerLinkActive="is-active" (click)="isMenuOpen = false">About us</a>
        <a routerLink="/events" routerLinkActive="is-active" (click)="isMenuOpen = false">Events</a>
        <a routerLink="/gallery" routerLinkActive="is-active" (click)="isMenuOpen = false">Gallery</a>
        <a routerLink="/contact-us" routerLinkActive="is-active" (click)="isMenuOpen = false">Contact</a>
      </nav>
      <div class="menu-toggle">
        <label for="check" [attr.aria-expanded]="isMenuOpen" aria-controls="primary-navigation">
          <span class="sr-only">{{ isMenuOpen ? 'Close navigation menu' : 'Open navigation menu' }}</span>
          <i class="fas" [ngClass]="isMenuOpen ? 'fa-times' : 'fa-bars'" aria-hidden="true"></i>
        </label>
      </div>
    </header>
  </section>
</section>
